<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선생님 앱 미리보기</title>
<style>
:root{--bg:#f4f6f3;--fg:#1c2a21;--line:#dfe5df;--brand:#1f5c3a;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--fg:#e8efe9;--line:#2c3a31;--card:#1c2a22}}
:root[data-theme="dark"]{--bg:#15201a;--fg:#e8efe9;--line:#2c3a31;--card:#1c2a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
header button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
main{display:flex;gap:20px;padding:16px;align-items:flex-start;overflow:auto}
.pane{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.pane .lb{font-size:13px;padding:6px 12px;border-bottom:1px solid var(--line);color:#6b7a70}
.pc{width:1080px}
.pc iframe{width:1080px;height:860px;border:0;display:block}
.phone{width:375px;border-radius:28px;border:8px solid #222}
.phone .lb{display:none}
.phone iframe{width:359px;height:780px;border:0;display:block}
@media (max-width:1500px){main{flex-wrap:wrap}}
@media (max-width:1120px){.pc{width:100%}.pc iframe{width:100%}}
</style>
</head>
<body>
<header><h1>선생님 앱 미리보기 — PC · 폰</h1><button onclick="reload()">다시 불러오기</button></header>
<main>
  <div class="pane pc"><div class="lb">PC (1080px)</div><iframe id="pc" src="https://wtihpeople.github.io/math/teacher/"></iframe></div>
  <div class="pane phone"><div class="lb">폰</div><iframe id="ph" src="https://wtihpeople.github.io/math/teacher/"></iframe></div>
</main>
<script>
function reload(){["pc","ph"].forEach(id=>{const f=document.getElementById(id);f.src=f.src.split("?")[0]+"?t="+Date.now()})}
</script>
</body>
</html>
