<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라임라잇수학 선생님</title>
<meta name="theme-color" content="#3f5c4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="라임라잇수학">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"Pretendard";font-weight:400;font-display:swap;src:url("fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-display:swap;src:url("fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-display:swap;src:url("fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-display:swap;src:url("fonts/Pretendard-Bold.woff2") format("woff2")}
/* 레이아웃: 폰은 한 화면에 탭 하나(아래 탭바), 컴퓨터(≥960px)는 오늘·출석·내 학생 세 단 펼침 */
:root{
  --bg:#F2F4F0; --panel:#FFFFFF; --ink:#1B2420; --sub:#5F6A64; --line:#D9DED8; --soft:#EAEEE7;
  --brand:#3F5C4A; --brand-ink:#FFFFFF; --lime:#8DB32B; --lime-soft:#EAF2D6;
  --ok:#2E7D4F; --ok-soft:#DDF0E3; --warn:#9A6406; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#F9E1DF; --info:#2F6FB3; --info-soft:#E2EDF9;
  --g:#c8e6c9; --y:#fff3b0; --r:#f4b4b4; --gr:#e4e4e4; --dk:#c9c2c2; --b:#dbe8f7;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1B2320; --ink:#E6EBE7; --sub:#9AA69F; --line:#2C3631; --soft:#232D28;
  --brand:#2F4A3A; --lime:#B5D94E; --lime-soft:#2A3417;
  --ok:#6FD3AE; --ok-soft:#16352B; --warn:#F2C063; --warn-soft:#3A2D12; --bad:#F29A85; --bad-soft:#3D1F18; --info:#8DB8EA; --info-soft:#1B2C42;
  --g:#2f5a33; --y:#5a5020; --r:#6a2f2f; --gr:#3a3f3c; --dk:#4a4444; --b:#2a3d55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1B2320; --ink:#E6EBE7; --sub:#9AA69F; --line:#2C3631; --soft:#232D28;
  --brand:#2F4A3A; --lime:#B5D94E; --lime-soft:#2A3417;
  --ok:#6FD3AE; --ok-soft:#16352B; --warn:#F2C063; --warn-soft:#3A2D12; --bad:#F29A85; --bad-soft:#3D1F18; --info:#8DB8EA; --info-soft:#1B2C42;
  --g:#2f5a33; --y:#5a5020; --r:#6a2f2f; --gr:#3a3f3c; --dk:#4a4444; --b:#2a3d55; color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button.lime{background:var(--lime);color:#1B2420;border-color:var(--lime);font-weight:700}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);width:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;padding:10px max(16px,calc((100% - 1048px)/2));display:flex;align-items:center;gap:10px}
.top b{font-size:18px;white-space:nowrap}.top .logo{height:40px;width:auto;flex:none}.top .logo[hidden]{display:none}
.badges{display:flex;gap:6px;margin-left:auto}.badges button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;padding:5px 11px;font-size:13px;border-radius:999px;white-space:nowrap}.badges button b{font-size:16px;margin-left:3px}.badges button span{margin-left:6px;opacity:.9;max-width:220px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}@media (max-width:640px){.badges button span{display:none}}.badges button.hot{background:#B3261E;border-color:#B3261E}
.chk{list-style:none;margin:0;padding:0}.chk li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;margin-top:6px;font-size:15.5px;line-height:1.4}.chk li.today{background:var(--bad-soft)}.chk li.week{background:var(--warn-soft)}.chk li.notice{background:var(--soft);cursor:pointer}.chk li.notice .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.chk li.notice.open .tx{display:block}.chk li .dt{color:var(--sub);font-size:13px;white-space:nowrap}.chk li a{color:inherit;text-decoration:none;flex:1}.chk li a:hover{text-decoration:underline}.chk li .lk{font-size:12px;color:var(--info);white-space:nowrap}.chk li .tg{flex:none;font-size:12px;border-radius:999px;padding:2px 9px;font-weight:700;white-space:nowrap;margin-left:auto}.chk li .tg.done{background:var(--ok-soft);color:var(--ok)}.chk li .tg.todo{background:var(--bad-soft);color:var(--bad)}.chk li.isdone{opacity:.6}.chk li.isdone a,.chk li.isdone span:first-child{text-decoration:line-through}.chk li .bx{flex:none}
.cls{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px}.cls .t{flex:1;min-width:0}.cls .t b{font-size:16px}.cls .t span{display:block;color:var(--sub);font-size:14px}.cls .wk{margin-top:4px;font-size:13.5px;line-height:1.45}.cls .wk b{font-size:13px;color:var(--sub);font-weight:500;margin-right:4px}
.cal{margin-top:8px}.cal .nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}.cal .nav b{font-size:17px;min-width:110px;text-align:center}.cal .nav button{padding:3px 10px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal .wd{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}.cal .wd:first-child{color:var(--bad)}.cal .wd:nth-child(7){color:var(--info)}
.cal .d{min-height:52px;border:1px solid var(--line);border-radius:6px;padding:2px 3px;font-size:12px;background:var(--panel);overflow:hidden}.cal .d.out{opacity:.35}.cal .d .n{font-size:12px;font-weight:600}.cal .d.tod .n{background:var(--brand);color:#fff;border-radius:999px;padding:0 6px}.cal .d .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1.3;border-radius:3px;padding:0 3px;margin-top:1px}.cal .d .ev.a{background:var(--lime-soft)}.cal .d .ev.n{background:var(--bad-soft);color:var(--bad);font-weight:700}.cal .d .ev.m{background:transparent;color:var(--warn);font-weight:700;padding:0}.cal .d.m{background:var(--warn-soft)}.cal .d.m .n{color:var(--warn)}
.cal .d.nn{background:var(--bad-soft)}.cal .d.nn .n{color:var(--bad)}.cal .d.nn .ev.n{background:transparent;padding:0}.cal .d.m.nn{background:linear-gradient(135deg,var(--bad-soft) 50%,var(--warn-soft) 50%)}
.cal .d.tod .n{background:var(--brand);color:#fff}
.tag{display:inline-block;width:10px;height:10px;border-radius:3px;margin:6px 6px 0 0;flex:none}.tag.a{background:var(--lime)}.tag.n{background:var(--bad)}.tag.m{background:#F0A040}
.cal .lst{margin-top:8px}.cal .lst .d2{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14.5px}.cal .lst .d2:first-child{border-top:0}.cal .lst .dd{min-width:64px;font-weight:700;white-space:nowrap}
@media (max-width:640px){.cal .d{min-height:40px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}.cal .d .ev{display:none}.cal .d .n{font-size:14px}.cal .d.a:not(.m):not(.nn){box-shadow:inset 0 -3px 0 var(--lime)}}
.sch-row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}.sch-row:first-child{border-top:0}.sch-row b{min-width:84px}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:70px 16px}.panel[hidden]{display:none}.panel .in{background:var(--panel);border-radius:14px;padding:14px 16px;max-width:520px;width:100%;max-height:70vh;overflow:auto}.top .meta{margin-left:auto;font-size:12.5px;opacity:.9;text-align:right;line-height:1.3;min-width:0}
.top button{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:4px 8px;font-size:12px;white-space:nowrap}
@media (max-width:640px){.top>b{display:none}.top .logo{height:34px}.top .meta{display:none}.badges button{padding:4px 8px;font-size:12px}}
/* PC 기본 폭: 네이버 홈처럼 1080px 가운데 고정(와이드 모니터는 양옆 여백) */
.wrap{max-width:1080px;margin:0 auto;padding-block:14px 84px;padding-inline:16px}
.screen{display:none;min-width:0}.screen.on{display:block}
h2{font-size:20px;margin:0 0 8px;text-wrap:balance}
h3{font-size:16px;margin:14px 0 6px;color:var(--ink);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.na{background:var(--soft);color:var(--sub)}
.list{list-style:none;margin:0;padding:0}.list li{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;align-items:flex-start}.list li:first-child{border-top:0}
.list li .t{flex:1;min-width:0}.list li small{display:block;color:var(--sub);font-size:12.5px}
.empty{color:var(--sub);font-size:14px;padding:10px 0;text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;border-radius:0;background:transparent;padding:9px 2px 7px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-selected="true"]{color:var(--brand);font-weight:700}
.tabs button .n{font-size:18px;line-height:1;font-weight:700}
.tabs button .dot{position:absolute}
.badge{display:inline-block;min-width:18px;text-align:center;font-size:11px;background:var(--bad);color:#fff;border-radius:999px;padding:0 5px;margin-left:3px}
/* 출석 */
.att{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.att:first-child{border-top:0}
.att .nm{font-weight:500}.att .nm small{color:var(--sub);font-weight:400;font-size:12px;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;background:transparent;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].a{background:var(--ok-soft);color:var(--ok);font-weight:700}
.seg button[aria-pressed="true"].x{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg button[aria-pressed="true"].l{background:var(--warn-soft);color:var(--warn);font-weight:700}
.note-in{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* 학생 */
.stu{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}
.stu:first-child{border-top:0}
.stu .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stu .hd b{font-size:15px}
.stu .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:3px;border:1px solid rgba(0,0,0,.08)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0 2px}
.bar i{display:block;height:100%}
.detail{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}.kv b{font-weight:500;color:var(--sub)}
/* 로그인 */
.login{max-width:420px;margin:40px auto}
.login label{display:block;font-size:13px;color:var(--sub);margin-top:10px}
.login .err{color:var(--bad);font-size:13.5px;margin-top:8px}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:10px;text-align:center}
.sched .d{display:flex;gap:10px;border-top:1px solid var(--line);padding:7px 0}.sched .d:first-child{border-top:0}
.sched .dd{min-width:58px;font-weight:700}.sched .kind{font-size:12px;color:var(--sub);margin-right:6px}
.grid3{display:block}
@media (min-width:960px){
  .tabs{display:none}
  .wrap{padding-bottom:30px}
  .grid3{display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:16px;align-items:start}
  .screen{display:block}
  .col{min-width:0}
  .col.left{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto;padding-right:2px}
  .col.bottom{grid-column:2}
  .col.right h2{font-size:24px}
  .col.right .cls{padding:14px 16px}.col.right .cls .t b{font-size:19px}.col.right .cls .t span{font-size:15px}.col.right .cls .wk{font-size:14.5px}.col.right .cls button{font-size:16px;padding:11px 18px}
  .col.right .att{padding:10px 0}.col.right .att .nm{font-size:17px}.col.right .seg button{padding:9px 16px;font-size:15px}
  .cal{display:grid;grid-template-columns:1.15fr 1fr;gap:0 20px;align-items:start}.cal .calL{min-width:0}.cal .calR{min-width:0}.cal .d{min-height:62px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="top" id="top" hidden>
  <img class="logo" id="logo" src="logo.png" alt="라임라잇수학학원" onerror="this.hidden=true">
  <b style="font-weight:500;opacity:.9">선생님</b>
  <div class="meta"><span id="who"></span><br><span id="when"></span></div>
  <div class="badges" id="badges">
    <button data-p="abs">결석<b id="nAbs">0</b></button>
    <button data-p="mk">보강<b id="nMk">0</b></button>
    <button data-p="todo">미완료<b id="nTodo">0</b><span id="todoHint"></span></button>
  </div>
  <button id="refresh" aria-label="새로고침">새로고침</button>
  <button id="logout">나가기</button>
</div>
<div class="panel" id="panel" hidden><div class="in"><div class="row" style="justify-content:space-between"><h2 id="panelTitle" style="margin:0"></h2><button id="panelClose">닫기</button></div><ul class="chk" id="panelList"></ul></div></div>

<div class="wrap">
  <!-- 로그인 -->
  <div class="login card" id="login">
    <div style="text-align:center;margin-bottom:6px"><img src="logo-dark.png" alt="라임라잇수학학원" style="height:64px"></div><h2 style="text-align:center;font-size:22px">선생님 앱</h2>
    <label for="nm">이름</label><input id="nm" placeholder="예) 김은혜" autocomplete="username">
    <label for="pin">PIN 4자리</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <input id="api" type="hidden">
    <div class="err" id="lerr" hidden></div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <button id="demo">예시 화면 보기</button>
      <button class="primary" id="go">들어가기</button>
    </div>
    <p style="font-size:13px;color:var(--sub);margin:12px 0 0">폰 홈화면에 넣기: 사파리 공유 → "홈 화면에 추가" / 크롬 메뉴 → "홈 화면에 추가".</p>
  </div>

  <div id="app" hidden>
  <div class="demo" id="demoBar" hidden>예시 데이터입니다. 실제 학생이 아닙니다.</div>
  <div class="grid3">
  <div class="col left">
    <!-- ① 꼭 확인 -->
    <section class="screen on" id="s-check" data-tab="check">
      <h2>꼭 확인</h2>
      <div class="card" id="c-notice"><h3 style="margin-top:0">공지사항</h3><ul class="chk" id="notices"></ul></div>
      <div class="card" id="c-today"><h3 style="margin-top:0">일일 업무</h3><ul class="chk" id="todoToday"></ul></div>
      <div class="card" id="c-week"><h3 style="margin-top:0">주간 업무</h3><ul class="chk" id="todoWeek"></ul></div>
      <div class="card" id="c-month"><h3 style="margin-top:0">월간 업무</h3><ul class="chk" id="todoMonth"></ul></div>
    </section>
  </div>
  <div class="col right">
    <!-- ② 오늘 수업 + 출석 -->
    <section class="screen" id="s-today" data-tab="today">
      <h2 id="todayTitle">오늘 수업</h2>
      <div class="card"><div id="todayClasses"></div><div id="todayMakeups"></div></div>
      <div class="card" id="attCard">
        <h3 style="margin-top:0">출석 · 진도</h3>
        <div class="row">
          <select id="attClass" aria-label="반 선택" style="flex:1;min-width:0"></select>
          <input id="attDate" type="date" style="width:auto">
        </div>
        <div id="attList" style="margin-top:6px"></div>
        <div id="lastWk" class="detail" style="margin-top:10px;font-size:14px" hidden></div>
        <label for="unit" style="font-size:14px;color:var(--sub);display:block;margin-top:10px">진도 <span id="bookMain" style="color:var(--ink)"></span></label>
        <input id="unit" placeholder="예) 7단원 p.84~91" enterkeyhint="next">
        <label for="hw" style="font-size:14px;color:var(--sub);display:block;margin-top:6px">과제</label>
        <input id="hw" placeholder="예) p.92~95 풀고 오답 정리" enterkeyhint="done">
        <details style="margin-top:6px"><summary style="font-size:14px;color:var(--sub);cursor:pointer">부교재 <span id="bookSub"></span></summary>
          <label for="subUnit" style="font-size:14px;color:var(--sub);display:block;margin-top:6px">부교재 진도</label><input id="subUnit">
          <label for="subHw" style="font-size:14px;color:var(--sub);display:block;margin-top:6px">부교재 과제</label><input id="subHw">
        </details>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span id="attSum" style="font-size:14px;color:var(--sub)"></span>
          <button class="lime" id="attSave">저장</button>
        </div>
        <div id="weeklyPreview" class="detail" hidden></div>
      </div>
      <div class="card" id="stuCard"><h3 style="margin-top:0">내 학생 <select id="stuClass" aria-label="반 선택" style="width:auto;display:inline-block;margin-left:6px;font-size:14px;padding:5px 8px"></select></h3>
        <div id="stuList" style="margin-top:6px"></div>
      </div>
      <div class="card"><h3 style="margin-top:0">내 학생 학교 내신</h3><div id="schools"></div></div>
    </section>
  </div>
  <div class="col bottom">
    <!-- ③ 일정 달력 -->
    <section class="screen" id="s-sch" data-tab="sch">
      <h2>일정</h2>
      <div class="card cal" id="cal"></div>
    </section>
  </div>
  </div>
  </div>

async function api(params){
  const base=ls.get("api")||""; if(!base) throw new Error("noapi");
  const u=new URL(base); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString(),{redirect:"follow"}); return r.json();
}
async function post(body){
  const base=ls.get("api")||""; if(!base) throw new Error("noapi");
  const r=await fetch(base,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}); return r.json();
}

function renderCal(){

  let cells="";for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),out=d.getMonth()!==M,tod=k===key(t);const es=by[k]||[];

  try{const r=await api({a:"bootstrap",t:ls.get("token")||"",fresh:fresh?"1":"0"});if(!r.ok)throw new Error(r.error||"fail");boot=r;ls.set("boot",JSON.stringify(r));showApp();if(shown)toast("최신으로 갱신했습니다"+(r.cached?" (2분 내 캐시)":""));}
  catch(e){if(shown&&e.message!=="auth"){toast("연결이 안 돼 저장된 화면을 보여줍니다")}else{ls.del("token");$("#app").hidden=true;$("#top").hidden=true;$("#tabs").hidden=true;$("#login").hidden=false;$("#lerr").textContent=e.message==="auth"?"다시 로그인해 주세요":"";$("#lerr").hidden=!$("#lerr").textContent}}
}
$("#go").onclick=async()=>{
  const base=$("#api").value.trim()||API_DEFAULT,name=$("#nm").value.trim(),pin=$("#pin").value.trim();
  if(!name||!pin){$("#lerr").textContent="이름과 PIN을 적어 주세요";$("#lerr").hidden=false;return}
  ls.set("api",base);$("#go").disabled=true;
  try{const r=await api({a:"login",name,pin});if(!r.ok)throw new Error(r.error==="login"?"이름 또는 PIN이 맞지 않습니다":"연결 실패");ls.set("token",r.token);demo=false;$("#go").textContent="불러오는 중…";await load();$("#go").textContent="들어가기";}
  catch(e){$("#lerr").textContent=e.message.includes("fetch")?"주소에 연결하지 못했습니다":e.message;$("#lerr").hidden=false}
  finally{$("#go").disabled=false}
};
$("#demo").onclick=()=>{demo=true;boot=demoData();showApp();};
$("#logout").onclick=()=>{ls.del("token");ls.del("boot");demo=false;att={};notes={};$("#app").hidden=true;$("#top").hidden=true;$("#tabs").hidden=true;$("#login").hidden=false;};
$("#refresh").onclick=()=>{if(demo){boot=demoData();render();toast("예시 화면을 새로 그렸습니다")}else{toast("새로 받는 중…");load(true)}};
const API_DEFAULT="https://script.google.com/macros/s/AKfycbxW5BKDfh3tuWTYDIaZILVPCZwRA4Vbsk0i09XN6-eEpJgauQjHp_hn5AP7x_xM2_Ra/exec";
$("#api").value=ls.get("api")||API_DEFAULT;
if(ls.get("token")&&ls.get("api"))load();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
